name: Bug report
description: Something in the herd doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Right-click a Pokémon…
        2. …
  - type: input
    id: mod
    attributes:
      label: Mod version
      description: Right-click the strip's ground → Settings → Updates.
      placeholder: "1.16.0"
    validations:
      required: true
  - type: input
    id: herdr
    attributes:
      label: Herdr version and OS
      placeholder: "Herdr 0.x, Ubuntu 26.04 (Wayland)"
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: The `errors` from `herdr-app status`, if any.
      render: text
